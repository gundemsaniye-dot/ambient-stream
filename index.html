<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- CarPlay ve mobil uyumlu 800x480 ve duyarlı ekran ayarı -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ambient Radio - CarPlay Live Stream</title>

  <!-- Stream settings (cosmetic key names; no security guarantee):
       r7Nq = GPS_TRACKING_ENABLED: 0 makes no location requests and waits v2Kp seconds;
       1 uses normal motion tracking. The app reads this JSON on every Stream entry.
       v2Kp = STARTUP_DELAY_SECONDS; s9Tx = REDIRECT_ENABLED; u4Wd = REDIRECT_URL.
       s9Tx 1 opens u4Wd (HTTPS only); 0 keeps this page.
       m1Lach (boolean): true allows CarPlay URL entry; false disables its keyboard. -->
  <script id="stream-config" type="application/json">
  {
    "r7Nq": 1,
    "v2Kp": 2,
    "s9Tx": 0,
    "u4Wd": "https://www.google.com",
    "m1Lach": true
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #06070a;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Tam Ekran Sinematik Arka Plan Resmi (Tasarım 2) */
    .cinematic-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/carplay_bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      filter: brightness(0.82) contrast(1.08);
      transform: scale(1.02);
    }

    /* Sinematik Karartma & Gradyan (Butonların ve Yazıların Okunurluğu İçin) */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(5, 7, 12, 0.45) 0%,
        rgba(5, 7, 12, 0.20) 45%,
        rgba(4, 6, 10, 0.88) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Sadece Yağmur Efekti: Canvas Katmanı */
    #rainCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* CarPlay Ana Sahne Konteyneri */
    .carplay-stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      padding: 16px 20px 16px 16px;
      gap: 16px;
    }

    /* Standart Apple CarPlay Sol Dock (Kenar Çubuğu) */
    .carplay-dock {
      width: 58px;
      height: 100%;
      background: rgba(14, 17, 24, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .dock-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dock-clock {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .dock-status-icons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      color: rgba(255, 255, 255, 0.85);
    }

    .dock-icon-svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .dock-home-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dock-home-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.22);
    }

    .home-grid-icon {
      width: 18px;
      height: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }

    .home-grid-icon span {
      background: #ffffff;
      border-radius: 2px;
    }

    /* Ana İçerik Alanı (Sinematik Tam Ekran ve Altta Yüzen Kart) */
    .carplay-main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Üst Canlı Bilgi Şeridi */
    .top-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .live-broadcast-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(12, 15, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #30d158;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .live-pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 10px #30d158;
      animation: pulseAnim 1.8s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .top-station-badge {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(12, 15, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.3px;
    }

    /* ALTA YÜZEN BUZLU CAM CARPLAY KONTROL KARTI (Tasarım 2'nin Yıldızı) */
    .floating-control-card {
      background: rgba(14, 17, 26, 0.82);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      padding: 18px 24px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
      display: grid;
      grid-template-columns: 1.4fr 1.6fr 1.1fr;
      align-items: center;
      gap: 20px;
    }

    /* Sol Kısım: Şarkı Bilgileri */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .track-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-category-tag {
      font-size: 11px;
      font-weight: 800;
      color: #ffd60a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .track-sync-indicator {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
    }

    .track-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.3px;
    }

    .track-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.68);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Orta Kısım: Senkronize Canlı Zaman Çubuğu */
    .card-timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffd60a 0%, #ffe359 100%);
      border-radius: 999px;
      transition: width 0.3s linear;
    }

    .timeline-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .live-synced-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #ffd60a;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Sağ Kısım: CarPlay Medya Tuşları */
    .card-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Büyük Apple Play/Pause Tuşu */
    .play-btn-main {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffd60a;
      color: #000000;
      border: none;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(255, 214, 10, 0.4);
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn-main:active {
      transform: scale(0.92);
      background: #e6c000;
    }

    .sync-btn {
      border-radius: 16px;
      width: auto;
      padding: 0 14px;
      height: 46px;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Gizli Medya Elemanı (MP4'lerin Sesi Kesintisiz Çalar) */
    #radioAudio {
      display: none;
    }

    /* CarPlay 800x480 ve Küçük Ekran Uyumluluk Ayarları */
    @media (max-width: 820px) {
      .carplay-stage {
        padding: 10px 12px;
        gap: 12px;
      }
      .carplay-dock {
        width: 50px;
        padding: 12px 6px;
        border-radius: 18px;
      }
      .floating-control-card {
        padding: 14px 18px;
        border-radius: 20px;
        gap: 14px;
      }
      .track-title {
        font-size: 18px;
      }
      .play-btn-main {
        width: 52px;
        height: 52px;
        font-size: 20px;
      }
      .ctrl-btn {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Sinematik Arka Plan & Karartma -->
  <div class="cinematic-bg"></div>
  <div class="bg-overlay"></div>

  <!-- Sadece Yağmur Efekti: HTML5 Canvas -->
  <canvas id="rainCanvas"></canvas>

  <!-- CarPlay Sahnesi -->
  <div class="carplay-stage">

    <!-- Sol Apple CarPlay Kenar Çubuğu (Dock) -->
    <aside class="carplay-dock">
      <div class="dock-top">
        <div class="dock-clock" id="dockClock">12:00</div>
        <div class="dock-status-icons">
          <!-- 5G Hücresel Sinyal Simgesi -->
          <svg class="dock-icon-svg" viewBox="0 0 24 24">
            <path d="M2 19h3v-3H2v3zm5 0h3v-7H7v7zm5 0h3v-11h-3v11zm5 0h3v-16h-3v16z"/>
          </svg>
          <!-- Batarya Simgesi -->
          <svg class="dock-icon-svg" viewBox="0 0 24 24">
            <path d="M16 8H6c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm4 2.5v3c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
          </svg>
        </div>
      </div>

      <!-- CarPlay Home / Grid Tuşu -->
      <div class="dock-home-btn" onclick="resyncToLive()" title="Sync to Live">
        <div class="home-grid-icon">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </aside>

    <!-- Ana Alan -->
    <main class="carplay-main">
      <!-- Üst Şerit: Canlı Radyo Rozeti & Bilgi -->
      <div class="top-meta-row">
        <div class="live-broadcast-pill">
          <span class="live-pulse-dot"></span>
          <span id="liveStatusText">CANLI RADYO YAYINI</span>
        </div>
        <div class="top-station-badge">
          Ambient Stream • 24/7 Global Audio
        </div>
      </div>

      <!-- ALTA YÜZEN BUZLU CAM CARPLAY KONTROL KARTI (Tasarım 2) -->
      <section class="floating-control-card">
        <!-- Sol: Şarkı Bilgisi -->
        <div class="card-meta">
          <div class="track-badge-row">
            <span class="track-category-tag" id="trackCategory">AMBIENCE</span>
            <span class="track-sync-indicator">• Herkeste Aynı Anda Çalıyor</span>
          </div>
          <div class="track-title" id="trackTitle">Ambient Radio Yükleniyor...</div>
          <div class="track-subtitle" id="trackSubtitle">Kesintisiz Canlı Ambient Müzik</div>
        </div>

        <!-- Orta: Senkronize Canlı Çubuk -->
        <div class="card-timeline">
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
          <div class="timeline-labels">
            <span id="currentTimeLabel">00:00</span>
            <span class="live-synced-pill">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="#ffd60a">
                <circle cx="12" cy="12" r="10"/>
              </svg>
              CANLI SENKRONİZE
            </span>
            <span id="durationLabel">00:00</span>
          </div>
        </div>

        <!-- Sağ: Medya Tuşları -->
        <div class="card-controls">
          <!-- Canlıya Eşitle (Sync Live) -->
          <button class="ctrl-btn sync-btn" onclick="resyncToLive()" title="Canlı Yayına Eşitle">
            ↺ Canlı
          </button>

          <!-- Büyük Apple Play/Pause Tuşu -->
          <button class="play-btn-main" id="playBtn" onclick="togglePlayback()" aria-label="Play/Pause">
            ▶
          </button>

          <!-- Ses / Mute Tuşu -->
          <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Sesi Aç/Kapat" aria-label="Mute">
            🔊
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- HTML5 Ses Elemanı (Normal-Video-low-bit .mp4 Dosyalarını Audio Olarak Çalar) -->
  <audio id="radioAudio" preload="auto" playsinline></audio>

  <script>
    /* =====================================================================
       1. STREAM YAPILANDIRMASI (DEĞERLER ASLA BOZULMAZ)
       ===================================================================== */
    const STREAM_CONFIG = Object.freeze(JSON.parse(document.getElementById("stream-config").textContent));
    if (STREAM_CONFIG.s9Tx === 1) {
      const destination = new URL(STREAM_CONFIG.u4Wd);
      if (destination.protocol === "https:") {
        window.location.replace(destination.href);
      }
    }

    /* =====================================================================
       2. ŞARKI LİSTESİ VE KESİN SÜRELER (Normal-Video-low-bit .mp4)
       Toplam Süre: ~4894.98 saniye (~81.5 dakika kesintisiz döngü)
       ===================================================================== */
    const PLAYLIST = [
      { id: "Indigo_Window_Seat", title: "Indigo Window Seat", category: "ambience", file: "Indigo_Window_Seat.mp4", duration: 146.17 },
      { id: "Window_Left_Ajar", title: "Window Left Ajar", category: "ambience", file: "Window_Left_Ajar.mp4", duration: 158.58 },
      { id: "Breath_Before_The_Dawn", title: "Breath Before The Dawn", category: "ambience", file: "Breath_Before_The_Dawn.mp4", duration: 162.92 },
      { id: "Streetlight_Patterns", title: "Streetlight Patterns", category: "ambience", file: "Streetlight_Patterns.mp4", duration: 166.96 },
      { id: "Seven_AM_on_the_Porch", title: "Seven AM on the Porch", category: "ambience", file: "Seven_AM_on_the_Porch.mp4", duration: 174.96 },
      { id: "Embers_and_Snowfall", title: "Embers and Snowfall", category: "ambience", file: "Embers_and_Snowfall.mp4", duration: 161.50 },
      { id: "Rain_Against_The_Glass", title: "Rain Against The Glass", category: "ambience", file: "Rain_Against_The_Glass.mp4", duration: 147.71 },
      { id: "Hearthside_Stills", title: "Hearthside Stills", category: "ambience", file: "Hearthside_Stills.mp4", duration: 152.21 },
      { id: "Behind_the_Pane", title: "Behind the Pane", category: "ambience", file: "Behind_the_Pane.mp4", duration: 170.58 },
      { id: "Asphalt_Sanctuary", title: "Asphalt Sanctuary", category: "ambience", file: "Asphalt_Sanctuary.mp4", duration: 140.75 },
      { id: "Glass_Panes_and_Morning_Birds", title: "Glass Panes and Morning Birds", category: "chill", file: "Glass_Panes_and_Morning_Birds.mp4", duration: 178.96 },
      { id: "Midnight_Hearth", title: "Midnight Hearth", category: "chill", file: "Midnight_Hearth.mp4", duration: 162.96 },
      { id: "Deep_Basin", title: "Deep Basin", category: "chill", file: "Deep_Basin.mp4", duration: 153.38 },
      { id: "rain_ambience_slow_atmospheri", title: "Rain Ambience", category: "chill", file: "rain_ambience_slow_atmospheri.mp4", duration: 158.79 },
      { id: "Under_the_Canopy", title: "Under the Canopy", category: "chill", file: "Under_the_Canopy.mp4", duration: 167.17 },
      { id: "Slow_Coffee_in_the_Rain", title: "Slow Coffee in the Rain", category: "chill", file: "Slow_Coffee_in_the_Rain.mp4", duration: 172.00 },
      { id: "The_Weightless_Hour", title: "The Weightless Hour", category: "chill", file: "The_Weightless_Hour.mp4", duration: 156.71 },
      { id: "Glass_Roof_Lullaby", title: "Glass Roof Lullaby", category: "chill", file: "Glass_Roof_Lullaby.mp4", duration: 173.75 },
      { id: "Rain_on_the_Attic_Glass", title: "Rain on the Attic Glass", category: "chill", file: "Rain_on_the_Attic_Glass.mp4", duration: 171.46 },
      { id: "Piano_in_the_Greenhouse", title: "Piano in the Greenhouse", category: "chill", file: "Piano_in_the_Greenhouse.mp4", duration: 166.79 },
      { id: "The_Parked_Hour", title: "The Parked Hour", category: "calm", file: "The_Parked_Hour.mp4", duration: 178.50 },
      { id: "Sleeping_In_Celestial_Light", title: "Sleeping in Celestial Light", category: "calm", file: "Sleeping_In_Celestial_Light.mp4", duration: 171.04 },
      { id: "Pavement_and_Pine", title: "Pavement and Pine", category: "calm", file: "Pavement_and_Pine.mp4", duration: 168.46 },
      { id: "Patterns_on_the_Glass", title: "Patterns on the Glass", category: "calm", file: "Patterns_on_the_Glass.mp4", duration: 161.04 },
      { id: "Between_Sleep_and_Waking", title: "Between Sleep and Waking", category: "calm", file: "Between_Sleep_and_Waking.mp4", duration: 166.33 },
      { id: "Seven_Thirty_AM", title: "Seven Thirty AM", category: "calm", file: "Seven_Thirty_AM.mp4", duration: 175.96 },
      { id: "Coffee_Steam_and_Asphalt", title: "Coffee Steam and Asphalt", category: "calm", file: "Coffee_Steam_and_Asphalt.mp4", duration: 179.79 },
      { id: "Midnight_Shoreline", title: "Midnight Shoreline", category: "calm", file: "Midnight_Shoreline.mp4", duration: 129.25 },
      { id: "Afternoon_Under_the_Cedar", title: "Afternoon Under the Cedar", category: "calm", file: "Afternoon_Under_the_Cedar.mp4", duration: 167.38 },
      { id: "Glass_Between_Us", title: "Glass Between Us", category: "calm", file: "Glass_Between_Us.mp4", duration: 152.92 }
    ];

    // Şarkıların başlama zamanlarını ve toplam süreyi hesapla
    let TOTAL_CYCLE_DURATION = 0;
    PLAYLIST.forEach(t => {
      t.startTime = TOTAL_CYCLE_DURATION;
      TOTAL_CYCLE_DURATION += t.duration;
    });

    /* =====================================================================
       3. KÜRESEL CANLI SENKRONİZASYON MOTORU
       Web sitesine kim girerse girsin o an aynı şarkı ve saniye çalar!
       ===================================================================== */
    function getLiveBroadcastState() {
      const nowSec = Date.now() / 1000;
      const cycleOffset = nowSec % TOTAL_CYCLE_DURATION;

      for (let i = 0; i < PLAYLIST.length; i++) {
        const track = PLAYLIST[i];
        if (cycleOffset >= track.startTime && cycleOffset < (track.startTime + track.duration)) {
          const trackOffset = cycleOffset - track.startTime;
          return {
            trackIndex: i,
            track: track,
            offset: trackOffset
          };
        }
      }
      return { trackIndex: 0, track: PLAYLIST[0], offset: 0 };
    }

    /* =====================================================================
       4. SES VE OYNATMA KONTROLÜ
       ===================================================================== */
    const audio = document.getElementById("radioAudio");
    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeLabel = document.getElementById("currentTimeLabel");
    const durationLabel = document.getElementById("durationLabel");
    const trackCategory = document.getElementById("trackCategory");
    const trackTitle = document.getElementById("trackTitle");
    const trackSubtitle = document.getElementById("trackSubtitle");
    const liveStatusText = document.getElementById("liveStatusText");

    let isPlaying = false;
    let currentTrackIndex = -1;

    function formatTime(seconds) {
      const s = Math.floor(seconds || 0);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${m < 10 ? "0" : ""}${m}:${rem < 10 ? "0" : ""}${rem}`;
    }

    function syncRadioToLive(forcePlay = false) {
      const live = getLiveBroadcastState();
      const currentSrcExpected = `Normal-Video-low-bit/${live.track.file}`;

      if (currentTrackIndex !== live.trackIndex || !audio.src.includes(encodeURI(live.track.file))) {
        currentTrackIndex = live.trackIndex;
        audio.src = currentSrcExpected;
        audio.load();
        audio.currentTime = live.offset;
      } else {
        // Eğer 2 saniyeden fazla sapma varsa düzelt
        if (Math.abs(audio.currentTime - live.offset) > 2.0) {
          audio.currentTime = live.offset;
        }
      }

      // UI Güncelle
      trackCategory.textContent = live.track.category.toUpperCase();
      trackTitle.textContent = live.track.title;
      trackSubtitle.textContent = `Ambient Radio • Canlı Parça ${live.trackIndex + 1}/${PLAYLIST.length}`;
      durationLabel.textContent = formatTime(live.track.duration);

      if (forcePlay || isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayBtnUI();
        }).catch(() => {
          isPlaying = false;
          updatePlayBtnUI();
        });
      }
    }

    function togglePlayback() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        syncRadioToLive(true);
      }
      updatePlayBtnUI();
    }

    function resyncToLive() {
      syncRadioToLive(isPlaying);
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    }

    function updatePlayBtnUI() {
      if (isPlaying) {
        playBtn.textContent = "⏸";
        liveStatusText.textContent = "CANLI YAYINDA • SENKRONİZE";
      } else {
        playBtn.textContent = "▶";
        liveStatusText.textContent = "DİNLEMEK İÇİN DOKUNUN";
      }
    }

    // Şarkı bittiğinde otomatik bir sonraki canlı şarkıya geçiş
    audio.addEventListener("ended", () => {
      syncRadioToLive(true);
    });

    // Zamanlayıcı: İlerleme çubuğunu ve süreyi sürekli güncelle
    setInterval(() => {
      if (!audio.src) return;
      const live = getLiveBroadcastState();
      
      const cur = isPlaying ? audio.currentTime : live.offset;
      const dur = live.track.duration;
      const pct = Math.min(100, Math.max(0, (cur / dur) * 100));

      progressBar.style.width = pct + "%";
      currentTimeLabel.textContent = formatTime(cur);

      // Canlı yayın kaymasını arka planda otomatik düzelt (drift control)
      if (isPlaying && Math.abs(audio.currentTime - live.offset) > 3.0) {
        audio.currentTime = live.offset;
      }
    }, 400);

    /* =====================================================================
       5. SAAT GÜNCELLEMESİ (CARPLAY DOCK İÇİN)
       ===================================================================== */
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById("dockClock");
      if (clockEl) clockEl.textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* =====================================================================
       6. SADECE YAĞMUR ANİMASYONU (HAREKETLİ TEK ŞEY)
       Gerçekçi cam üstü su damlacıkları ve süzülen yağmur çizgileri
       ===================================================================== */
    const rainCanvas = document.getElementById("rainCanvas");
    const rCtx = rainCanvas.getContext("2d");

    function resizeCanvas() {
      rainCanvas.width = window.innerWidth;
      rainCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Düşen Yağmur Damlaları (Hafif Rüzgarlı Doğal Açı)
    const DROP_COUNT = 95;
    const drops = [];
    for (let i = 0; i < DROP_COUNT; i++) {
      drops.push({
        x: Math.random() * window.innerWidth * 1.2,
        y: Math.random() * window.innerHeight,
        length: 14 + Math.random() * 22,
        speed: 12 + Math.random() * 14,
        opacity: 0.18 + Math.random() * 0.32,
        width: 1.0 + Math.random() * 1.4
      });
    }

    // Cam Üstünde Duran ve Yavaş Süzülen Yoğuşma Damlaları
    const GLASS_DROP_COUNT = 36;
    const glassDrops = [];
    for (let i = 0; i < GLASS_DROP_COUNT; i++) {
      glassDrops.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: 1.5 + Math.random() * 3.0,
        speed: 0.12 + Math.random() * 0.35,
        opacity: 0.25 + Math.random() * 0.35,
        trickleCounter: Math.random() * 100
      });
    }

    function animateRain() {
      rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);

      // 1. Düşen Yağmur Çizgileri
      rCtx.lineCap = "round";
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        rCtx.strokeStyle = `rgba(215, 230, 255, ${d.opacity})`;
        rCtx.lineWidth = d.width;
        rCtx.beginPath();
        rCtx.moveTo(d.x, d.y);
        // Hafif sağa eğimli rüzgar açısı (CarPlay penceresi görünümü)
        rCtx.lineTo(d.x - 3.5, d.y + d.length);
        rCtx.stroke();

        d.y += d.speed;
        d.x -= 1.8;

        if (d.y > rainCanvas.height + 25) {
          d.y = -30;
          d.x = Math.random() * (rainCanvas.width + 100);
        }
      }

      // 2. Cam Üzerindeki Damlacıklar ve Yavaş Süzülme
      for (let i = 0; i < glassDrops.length; i++) {
        const gd = glassDrops[i];
        rCtx.fillStyle = `rgba(235, 245, 255, ${gd.opacity})`;
        rCtx.beginPath();
        rCtx.arc(gd.x, gd.y, gd.radius, 0, Math.PI * 2);
        rCtx.fill();

        gd.trickleCounter += 0.2;
        if (gd.trickleCounter > 80) {
          gd.y += gd.speed;
          if (gd.trickleCounter > 120) {
            gd.trickleCounter = 0;
          }
        }

        if (gd.y > rainCanvas.height + 10) {
          gd.y = -10;
          gd.x = Math.random() * rainCanvas.width;
        }
      }

      requestAnimationFrame(animateRain);
    }
    animateRain();

    // Sayfa açıldığında yayını hemen eşitle
    window.addEventListener("DOMContentLoaded", () => {
      syncRadioToLive(false);

      // İlk kullanıcı tıklamasında çalmayı başlat
      document.body.addEventListener("click", function firstClickInit() {
        if (!isPlaying) {
          togglePlayback();
        }
        document.body.removeEventListener("click", firstClickInit);
      }, { once: true });
    });
  </script>
</body>
</html>
