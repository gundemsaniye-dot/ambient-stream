<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Optimized for CarPlay (800x480) and modern responsive mobile/desktop viewports -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ambient Lofi - Music Radio</title>

  <!-- Stream settings (cosmetic key names; no security guarantee):
       r7Nq = GPS_TRACKING_ENABLED: 0 makes no location requests and waits v2Kp seconds;
       1 uses normal motion tracking. The app reads this JSON on every Stream entry.
       v2Kp = STARTUP_DELAY_SECONDS; s9Tx = REDIRECT_ENABLED; u4Wd = REDIRECT_URL.
       s9Tx 1 opens u4Wd (HTTPS only); 0 keeps this page.
       m1Lach (boolean): true allows CarPlay URL entry; false disables its keyboard. -->
  <script id="stream-config" type="application/json">
  {
    "r7Nq": 1,
    "v2Kp": 2,
    "s9Tx": 0,
    "u4Wd": "https://www.google.com",
    "m1Lach": true
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #06080e;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Cinematic Atmospheric Background */
    .ambient-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/carplay_bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      filter: brightness(0.85) contrast(1.05);
      transform: scale(1.02);
    }

    /* Ambient Contrast Gradient Overlay */
    .bg-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(4, 6, 10, 0.45) 0%,
        rgba(4, 6, 10, 0.15) 45%,
        rgba(3, 5, 8, 0.80) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Realistic Rain Canvas Layer */
    #rainCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* CENTERED MAIN PLAYER VIEW */
    .center-player-viewport {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
    }

    .center-player-stack {
      width: 100%;
      max-width: 510px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      margin: auto;
    }

    /* ========================================================
       1. TAP TO LISTEN BADGE (ABOVE LIVE WITH BLINKING BORDER)
       ======================================================== */
    .tap-listen-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(14, 18, 28, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd60a;
      cursor: pointer;
      border: 1.8px solid #ffd60a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      animation: blinkBorder 1.2s infinite ease-in-out;
      transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
    }

    .tap-listen-badge:active {
      transform: scale(0.94);
    }

    .tap-listen-badge.fade-out {
      opacity: 0 !important;
      transform: translateY(-8px) scale(0.92) !important;
      pointer-events: none !important;
    }

    @keyframes blinkBorder {
      0%, 100% {
        border-color: #ffd60a;
        box-shadow: 0 0 16px rgba(255, 214, 10, 0.80), inset 0 0 8px rgba(255, 214, 10, 0.30);
        color: #ffffff;
      }
      50% {
        border-color: rgba(255, 214, 10, 0.20);
        box-shadow: 0 0 2px rgba(255, 214, 10, 0.05);
        color: rgba(255, 255, 255, 0.65);
      }
    }

    .tap-icon {
      font-size: 10px;
      color: #ffd60a;
    }

    /* ========================================================
       2. LIVE PILL BADGE (ABOVE PLAYER CARD, NO TOUCH/OVERLAP & SLOW CALM BREATHING)
       ======================================================== */
    .live-pill-badge {
      position: absolute;
      bottom: calc(100% + 9px);
      left: 14px;
      z-index: 15;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.35) 0%, rgba(18, 55, 30, 0.92) 100%);
      border: 1.5px solid rgba(74, 222, 128, 0.70);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      padding: 4px 13px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #4ade80;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), inset 0 1px 1.5px rgba(255, 255, 255, 0.5);
      animation: liveSlowBreathe 3.4s infinite ease-in-out;
    }

    @keyframes liveSlowBreathe {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 12px rgba(74, 222, 128, 0.65), inset 0 1px 1.5px rgba(255, 255, 255, 0.5);
      }
      50% {
        opacity: 0.55;
        box-shadow: 0 0 3px rgba(74, 222, 128, 0.15), inset 0 1px 1.5px rgba(255, 255, 255, 0.25);
      }
    }

    .live-dot-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseGreen 3.4s infinite ease-in-out;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.9); }
    }

    /* ========================================================
       3. DIGITAL DOT MATRIX CLOCK (10% ENLARGED)
       ======================================================== */
    .dot-matrix-clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 2px 0;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.90));
      transform: scale(1.10);
      transform-origin: center center;
    }

    .dot-matrix-svg {
      width: 148px;
      height: 38px;
      display: block;
    }

    /* 4. BRAND TITLE & SUBTITLE */
    .main-title-wrap {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.05;
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.85);
      text-align: center;
      margin-top: 2px;
    }

    .main-title-wrap .brand-ambient {
      color: #ffffff;
    }

    .main-title-wrap .brand-lofi {
      color: #f28b82;
      margin-left: 6px;
    }

    .sub-brand-text {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.80);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      margin-top: -6px;
      margin-bottom: 2px;
    }

    /* ========================================================
       5. ULTRA LIQUID GLASS NOW PLAYING CARD
       ======================================================== */
    .now-playing-card {
      width: 100%;
      margin-top: 26px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.32) 0%,
        rgba(255, 255, 255, 0.10) 35%,
        rgba(10, 16, 28, 0.75) 100%
      );
      backdrop-filter: blur(56px) saturate(240%);
      -webkit-backdrop-filter: blur(56px) saturate(240%);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 24px;
      padding: 14px 22px;
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.85),
        inset 0 2.5px 3px rgba(255, 255, 255, 0.70),
        inset 0 -2.5px 3px rgba(0, 0, 0, 0.50);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
    }

    .card-left-group {
      display: flex;
      align-items: center;
      gap: 15px;
      overflow: hidden;
    }

    .album-art-thumb {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.40);
    }

    .track-titles {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .song-title {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .song-artist {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.80);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Live Audio Equalizer Bars */
    .audio-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3.5px;
      height: 24px;
      padding-right: 4px;
      flex-shrink: 0;
    }

    .eq-stick {
      width: 3.5px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 2px;
      height: 5px;
      transition: height 0.15s ease;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .playing .eq-stick:nth-child(1) { animation: bounceEq 0.65s infinite ease-in-out; }
    .playing .eq-stick:nth-child(2) { animation: bounceEq 0.42s infinite ease-in-out 0.1s; }
    .playing .eq-stick:nth-child(3) { animation: bounceEq 0.78s infinite ease-in-out 0.2s; }
    .playing .eq-stick:nth-child(4) { animation: bounceEq 0.52s infinite ease-in-out 0.15s; }
    .playing .eq-stick:nth-child(5) { animation: bounceEq 0.85s infinite ease-in-out 0.05s; }
    .playing .eq-stick:nth-child(6) { animation: bounceEq 0.60s infinite ease-in-out 0.25s; }
    .playing .eq-stick:nth-child(7) { animation: bounceEq 0.72s infinite ease-in-out 0.18s; }
    .playing .eq-stick:nth-child(8) { animation: bounceEq 0.48s infinite ease-in-out 0.12s; }
    .playing .eq-stick:nth-child(9) { animation: bounceEq 0.66s infinite ease-in-out 0.22s; }
    .playing .eq-stick:nth-child(10) { animation: bounceEq 0.54s infinite ease-in-out 0.08s; }

    @keyframes bounceEq {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }

    /* 6. TIMELINE & PROGRESS BAR */
    .timeline-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffd60a;
      border-radius: 999px;
      position: relative;
      box-shadow: 0 0 12px rgba(255, 214, 10, 0.8);
      transition: width 0.3s linear;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 214, 10, 1), 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .time-labels-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.3px;
    }

    /* 7. THREE CIRCULAR MEDIA BUTTONS */
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 2px;
    }

    .circle-btn {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .circle-btn:active {
      transform: scale(0.92);
    }

    .side-action-btn {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.08) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1.5px rgba(255, 255, 255, 0.45);
    }

    .side-action-btn:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.14) 100%);
      border-color: rgba(255, 255, 255, 0.75);
    }

    .center-play-btn {
      width: 74px;
      height: 74px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.12) 100%);
      border: 3px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 
        0 12px 36px rgba(0, 0, 0, 0.70), 
        inset 0 2px 3px rgba(255, 255, 255, 0.7);
    }

    .center-play-btn:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.40) 0%, rgba(255, 255, 255, 0.20) 100%);
      border-color: #ffffff;
    }

    .btn-svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .play-btn-svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    /* In-viewport 2px audio pipeline (prevents WebKit throttling) */
    #radioMedia {
      position: fixed;
      width: 2px;
      height: 2px;
      left: 0;
      top: 0;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }

    /* CarPlay 800x480 & Small Display Responsiveness */
    @media (max-height: 500px) {
      .dot-matrix-svg {
        width: 120px;
        height: 30px;
      }
      .center-player-stack {
        max-width: 460px;
        gap: 5px;
      }
      .main-title-wrap {
        font-size: 28px;
      }
      .sub-brand-text {
        font-size: 11px;
        letter-spacing: 2px;
      }
      .now-playing-card {
        padding: 8px 16px;
        border-radius: 18px;
        margin-top: 22px;
      }
      .live-pill-badge {
        bottom: calc(100% + 7px);
        font-size: 10px;
        padding: 3px 11px;
      }
      .album-art-thumb {
        width: 48px;
        height: 48px;
      }
      .song-title {
        font-size: 16px;
      }
      .center-play-btn {
        width: 58px;
        height: 58px;
      }
      .side-action-btn {
        width: 42px;
        height: 42px;
      }
      .tap-listen-badge {
        padding: 4px 14px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Picture -->
  <div class="ambient-bg"></div>
  <div class="bg-gradient-overlay"></div>

  <!-- Rain Effect Canvas -->
  <canvas id="rainCanvas"></canvas>

  <!-- CENTERED MAIN PLAYER VIEW -->
  <main class="center-player-viewport">
    <div class="center-player-stack" id="playerZone">

      <!-- 1. TAP TO LISTEN (WITH BLINKING BORDER LINE) -->
      <div class="tap-listen-badge" id="tapBadge" onclick="unlockAudioImmediately()">
        <span class="tap-icon">▶</span>
        <span id="tapBadgeText">Tap To Listen</span>
      </div>

      <!-- 2. DIGITAL DOT MATRIX CLOCK (10% ENLARGED) -->
      <div class="dot-matrix-clock-container" title="Dot Matrix Clock">
        <svg id="dotMatrixClock" class="dot-matrix-svg" viewBox="0 0 148 42"></svg>
      </div>

      <!-- 3. BRAND TITLE & SUBTITLE -->
      <div class="main-title-wrap">
        <span class="brand-ambient">Ambient</span><span class="brand-lofi">Lofi</span>
      </div>
      <div class="sub-brand-text">Music Radio</div>

      <!-- 4. ULTRA LIQUID GLASS NOW PLAYING CARD -->
      <div class="now-playing-card">
        <!-- LIVE BADGE (ALIGNED TO TOP-LEFT TIP OF THE CARD & BLINKING) -->
        <div class="live-pill-badge">
          <span class="live-dot-pulse"></span>
          <span>LIVE</span>
        </div>

        <div class="card-left-group">
          <!-- Album Thumbnail -->
          <img class="album-art-thumb" src="assets/album_thumb.jpg" alt="Album Art" />
          <div class="track-titles">
            <div class="song-title" id="trackTitle">Rainy Evening</div>
            <div class="song-artist" id="trackArtist">Lofi Vibes • 24/7 Live Stream</div>
          </div>
        </div>

        <!-- Live Audio Equalizer Bars -->
        <div class="audio-eq-bars" id="eqBars">
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
          <span class="eq-stick"></span>
        </div>
      </div>

      <!-- 6. TIMELINE & PROGRESS BAR -->
      <div class="timeline-container">
        <div class="progress-track">
          <div class="progress-fill" id="progressBar">
            <span class="progress-thumb"></span>
          </div>
        </div>
        <div class="time-labels-row">
          <span id="currentTime">00:00</span>
          <span id="totalDuration">00:00</span>
        </div>
      </div>

      <!-- 7. THREE CIRCULAR MEDIA BUTTONS -->
      <div class="buttons-row">
        <!-- Left: Mute / Unmute -->
        <button class="circle-btn side-action-btn" id="muteBtn" onclick="toggleMute()" title="Mute / Unmute" aria-label="Mute">
          <svg class="btn-svg" id="muteIcon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Center: Play / Pause -->
        <button class="circle-btn center-play-btn" id="playBtn" onclick="togglePlayback()" title="Play / Pause" aria-label="Play/Pause">
          <svg class="play-btn-svg" id="playIconSvg" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Right: Sync to Live -->
        <button class="circle-btn side-action-btn" onclick="resyncToLive()" title="Sync to Live Broadcast" aria-label="Sync Live">
          <svg class="btn-svg" viewBox="0 0 24 24">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>

    </div>
  </main>

  <!-- HTML5 Media Element -->
  <video id="radioMedia" playsinline webkit-playsinline preload="auto"></video>

  <script>
    /* =====================================================================
       1. STREAM CONFIG (NEVER ALTER OR BREAK)
       ===================================================================== */
    const STREAM_CONFIG = Object.freeze(JSON.parse(document.getElementById("stream-config").textContent));
    if (STREAM_CONFIG.s9Tx === 1) {
      const destination = new URL(STREAM_CONFIG.u4Wd);
      if (destination.protocol === "https:") {
        window.location.replace(destination.href);
      }
    }

    /* =====================================================================
       2. TRACK CATALOG & PRECISE DURATIONS (Normal-Video-low-bit .mp4)
       ===================================================================== */
    const PLAYLIST = [
      { id: "Indigo_Window_Seat", title: "Indigo Window Seat", category: "Lofi Vibes", file: "Indigo_Window_Seat.mp4", duration: 146.17 },
      { id: "Window_Left_Ajar", title: "Window Left Ajar", category: "Lofi Vibes", file: "Window_Left_Ajar.mp4", duration: 158.58 },
      { id: "Breath_Before_The_Dawn", title: "Breath Before The Dawn", category: "Lofi Vibes", file: "Breath_Before_The_Dawn.mp4", duration: 162.92 },
      { id: "Streetlight_Patterns", title: "Streetlight Patterns", category: "Lofi Vibes", file: "Streetlight_Patterns.mp4", duration: 166.96 },
      { id: "Seven_AM_on_the_Porch", title: "Seven AM on the Porch", category: "Lofi Vibes", file: "Seven_AM_on_the_Porch.mp4", duration: 174.96 },
      { id: "Embers_and_Snowfall", title: "Embers and Snowfall", category: "Lofi Vibes", file: "Embers_and_Snowfall.mp4", duration: 161.50 },
      { id: "Rain_Against_The_Glass", title: "Rain Against The Glass", category: "Lofi Vibes", file: "Rain_Against_The_Glass.mp4", duration: 147.71 },
      { id: "Hearthside_Stills", title: "Hearthside Stills", category: "Lofi Vibes", file: "Hearthside_Stills.mp4", duration: 152.21 },
      { id: "Behind_the_Pane", title: "Behind the Pane", category: "Lofi Vibes", file: "Behind_the_Pane.mp4", duration: 170.58 },
      { id: "Asphalt_Sanctuary", title: "Asphalt Sanctuary", category: "Lofi Vibes", file: "Asphalt_Sanctuary.mp4", duration: 140.75 },
      { id: "Glass_Panes_and_Morning_Birds", title: "Glass Panes and Morning Birds", category: "Chill Beats", file: "Glass_Panes_and_Morning_Birds.mp4", duration: 178.96 },
      { id: "Midnight_Hearth", title: "Midnight Hearth", category: "Chill Beats", file: "Midnight_Hearth.mp4", duration: 162.96 },
      { id: "Deep_Basin", title: "Deep Basin", category: "Chill Beats", file: "Deep_Basin.mp4", duration: 153.38 },

      { id: "Pavement_and_Pine", title: "Pavement and Pine", category: "Nocturnal Calm", file: "Pavement_and_Pine.mp4", duration: 168.46 },
      { id: "Patterns_on_the_Glass", title: "Patterns on the Glass", category: "Nocturnal Calm", file: "Patterns_on_the_Glass.mp4", duration: 161.04 },
      { id: "Between_Sleep_and_Waking", title: "Between Sleep and Waking", category: "Nocturnal Calm", file: "Between_Sleep_and_Waking.mp4", duration: 166.33 },

      { id: "Afternoon_Under_the_Cedar", title: "Afternoon Under the Cedar", category: "Nocturnal Calm", file: "Afternoon_Under_the_Cedar.mp4", duration: 167.38 },
      { id: "Glass_Between_Us", title: "Glass Between Us", category: "Nocturnal Calm", file: "Glass_Between_Us.mp4", duration: 152.92 }
    ];

    let TOTAL_CYCLE_DURATION = 0;
    PLAYLIST.forEach(t => {
      t.startTime = TOTAL_CYCLE_DURATION;
      TOTAL_CYCLE_DURATION += t.duration;
    });

    /* =====================================================================
       3. GLOBAL SYNCHRONIZATION ENGINE
       ===================================================================== */
    function getLiveBroadcastState() {
      const nowSec = Date.now() / 1000;
      const cycleOffset = nowSec % TOTAL_CYCLE_DURATION;

      for (let i = 0; i < PLAYLIST.length; i++) {
        const track = PLAYLIST[i];
        if (cycleOffset >= track.startTime && cycleOffset < (track.startTime + track.duration)) {
          const trackOffset = cycleOffset - track.startTime;
          return {
            trackIndex: i,
            track: track,
            offset: trackOffset
          };
        }
      }
      return { trackIndex: 0, track: PLAYLIST[0], offset: 0 };
    }

    /* =====================================================================
       4. AUDIO ENGINE & SEAMLESS AUTOPLAY UNLOCK
       ===================================================================== */
    const media = document.getElementById("radioMedia");
    const playBtn = document.getElementById("playBtn");
    const playIconSvg = document.getElementById("playIconSvg");
    const muteIcon = document.getElementById("muteIcon");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const totalDurationEl = document.getElementById("totalDuration");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const playerZone = document.getElementById("playerZone");
    const tapBadge = document.getElementById("tapBadge");
    const tapBadgeText = document.getElementById("tapBadgeText");

    let isPlaying = false;
    let currentTrackIndex = -1;
    let targetSeekOffset = 0;

    function formatTime(seconds) {
      const s = Math.floor(seconds || 0);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${m < 10 ? "0" : ""}${m}:${rem < 10 ? "0" : ""}${rem}`;
    }

    function applySafeSeek(offset) {
      targetSeekOffset = offset;
      if (media.readyState >= 1 && media.duration && !isNaN(media.duration)) {
        try {
          const clamped = Math.max(0, Math.min(offset, media.duration - 0.5));
          if (Math.abs(media.currentTime - clamped) > 1.5) {
            media.currentTime = clamped;
          }
        } catch (e) {
          console.warn("Seek error:", e);
        }
      } else {
        const onMeta = () => {
          media.removeEventListener("loadedmetadata", onMeta);
          try {
            const clamped = Math.max(0, Math.min(targetSeekOffset, (media.duration || 100) - 0.5));
            media.currentTime = clamped;
          } catch (_) {}
        };
        media.addEventListener("loadedmetadata", onMeta);
      }
    }

    function syncRadioToLive(forcePlay = true) {
      const live = getLiveBroadcastState();
      const currentSrcExpected = `Normal-Video-low-bit/${live.track.file}`;

      trackTitle.textContent = live.track.title;
      trackArtist.textContent = `${live.track.category} • 24/7 Live Stream`;
      totalDurationEl.textContent = formatTime(live.track.duration);

      if (currentTrackIndex !== live.trackIndex || !media.src.includes(encodeURI(live.track.file))) {
        currentTrackIndex = live.trackIndex;
        media.src = currentSrcExpected;
        media.load();
      }

      applySafeSeek(live.offset);

      if (forcePlay) {
        attemptAutoplay();
      }
    }

    function attemptAutoplay() {
      media.muted = false;
      const playPromise = media.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
          updatePlayUI();
          hideTapBadge();
        }).catch(() => {
          // Autoplay blocked: start muted in background & arm touch unlock
          media.muted = true;
          media.play().then(() => {
            isPlaying = true;
            updatePlayUI();
            armFullWindowUnlock();
          }).catch(() => {
            isPlaying = false;
            updatePlayUI();
            armFullWindowUnlock();
          });
        });
      }
    }

    let unlocked = false;
    let tapBadgeDismissed = false;

    function hideTapBadge() {
      if (tapBadgeDismissed) return;
      tapBadgeDismissed = true;
      const tb = document.getElementById("tapBadge");
      if (!tb) return;
      tb.classList.add("fade-out");
      setTimeout(() => {
        tb.style.display = "none";
      }, 350);
    }

    function unlockAudioImmediately() {
      unlocked = true;
      media.muted = false;
      hideTapBadge();
      syncRadioToLive(true);
    }

    function armFullWindowUnlock() {
      const events = ['pointerdown', 'touchstart', 'click', 'keydown'];
      const onFirstTap = () => {
        events.forEach(e => window.removeEventListener(e, onFirstTap, true));
        unlockAudioImmediately();
      };
      events.forEach(e => window.addEventListener(e, onFirstTap, { once: true, capture: true }));
    }

    function togglePlayback() {
      if (isPlaying && !media.muted) {
        media.pause();
        isPlaying = false;
        updatePlayUI();
      } else {
        unlockAudioImmediately();
      }
    }

    function resyncToLive() {
      unlockAudioImmediately();
    }

    function toggleMute() {
      media.muted = !media.muted;
      if (media.muted) {
        muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else {
        muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
      updatePlayUI();
    }

    function updatePlayUI() {
      if (isPlaying && !media.muted) {
        playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        playerZone.classList.add("playing");
        hideTapBadge();
      } else {
        playIconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playerZone.classList.remove("playing");
      }
    }

    media.addEventListener("ended", () => {
      syncRadioToLive(true);
    });

    setInterval(() => {
      if (!media.src) return;
      const live = getLiveBroadcastState();
      const cur = isPlaying ? media.currentTime : live.offset;
      const dur = live.track.duration || 180;
      const pct = Math.min(100, Math.max(0, (cur / dur) * 100));

      progressBar.style.width = pct + "%";
      currentTimeEl.textContent = formatTime(cur);

      if (isPlaying && Math.abs(media.currentTime - live.offset) > 3.0) {
        applySafeSeek(live.offset);
      }
    }, 400);

    /* =====================================================================
       5. PHYSICAL 5x7 LED DOT MATRIX CLOCK (DIRECTLY BELOW LIVE BADGE!)
       ===================================================================== */
    const DOT_PATTERNS = {
      '0': ['01110','10001','10011','10101','11001','10001','01110'],
      '1': ['00100','01100','00100','00100','00100','00100','01110'],
      '2': ['01110','10001','00001','00010','00100','01000','11111'],
      '3': ['11110','00001','00001','01110','00001','00001','11110'],
      '4': ['00010','00110','01010','10010','11111','00010','00010'],
      '5': ['11111','10000','11110','00001','00001','10001','01110'],
      '6': ['00110','01000','10000','11110','10001','10001','01110'],
      '7': ['11111','00001','00010','00100','01000','01000','01000'],
      '8': ['01110','10001','10001','01110','10001','10001','01110'],
      '9': ['01110','10001','10001','01111','00001','00010','01100'],
      ':': ['00','11','11','00','11','11','00']
    };

    function renderDotMatrixClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const str = `${h}:${m}`;
      const svg = document.getElementById("dotMatrixClock");
      if (!svg) return;

      const dotRadius = 1.8;
      const step = 5.2;
      let startX = 6;
      let svgHtml = '';

      for (let c = 0; c < str.length; c++) {
        const char = str[c];
        const pattern = DOT_PATTERNS[char] || DOT_PATTERNS['0'];
        const cols = pattern[0].length;

        for (let row = 0; row < 7; row++) {
          for (let col = 0; col < cols; col++) {
            const isLit = pattern[row][col] === '1';
            const cx = startX + col * step;
            const cy = 4 + row * step;

            if (isLit) {
              svgHtml += `<circle cx="${cx}" cy="${cy}" r="${dotRadius}" fill="#ffffff" filter="drop-shadow(0 0 2.5px rgba(255,255,255,0.95))" />`;
            } else {
              svgHtml += `<circle cx="${cx}" cy="${cy}" r="${dotRadius * 0.85}" fill="rgba(255,255,255,0.07)" />`;
            }
          }
        }
        startX += cols * step + (char === ':' ? 6 : 8);
      }

      svg.innerHTML = svgHtml;
    }

    renderDotMatrixClock();
    setInterval(renderDotMatrixClock, 1000);

    /* =====================================================================
       6. RAIN CANVAS ANIMATION
       ===================================================================== */
    const rainCanvas = document.getElementById("rainCanvas");
    const rCtx = rainCanvas.getContext("2d");

    function resizeCanvas() {
      rainCanvas.width = window.innerWidth;
      rainCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const DROP_COUNT = 95;
    const drops = [];
    for (let i = 0; i < DROP_COUNT; i++) {
      drops.push({
        x: Math.random() * window.innerWidth * 1.2,
        y: Math.random() * window.innerHeight,
        length: 14 + Math.random() * 22,
        speed: 12 + Math.random() * 14,
        opacity: 0.18 + Math.random() * 0.32,
        width: 1.0 + Math.random() * 1.4
      });
    }

    const GLASS_DROP_COUNT = 36;
    const glassDrops = [];
    for (let i = 0; i < GLASS_DROP_COUNT; i++) {
      glassDrops.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: 1.5 + Math.random() * 3.0,
        speed: 0.12 + Math.random() * 0.35,
        opacity: 0.25 + Math.random() * 0.35,
        trickleCounter: Math.random() * 100
      });
    }

    function animateRain() {
      rCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);

      rCtx.lineCap = "round";
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        rCtx.strokeStyle = `rgba(215, 230, 255, ${d.opacity})`;
        rCtx.lineWidth = d.width;
        rCtx.beginPath();
        rCtx.moveTo(d.x, d.y);
        rCtx.lineTo(d.x - 3.5, d.y + d.length);
        rCtx.stroke();

        d.y += d.speed;
        d.x -= 1.8;

        if (d.y > rainCanvas.height + 25) {
          d.y = -30;
          d.x = Math.random() * (rainCanvas.width + 100);
        }
      }

      for (let i = 0; i < glassDrops.length; i++) {
        const gd = glassDrops[i];
        rCtx.fillStyle = `rgba(235, 245, 255, ${gd.opacity})`;
        rCtx.beginPath();
        rCtx.arc(gd.x, gd.y, gd.radius, 0, Math.PI * 2);
        rCtx.fill();

        gd.trickleCounter += 0.2;
        if (gd.trickleCounter > 80) {
          gd.y += gd.speed;
          if (gd.trickleCounter > 120) {
            gd.trickleCounter = 0;
          }
        }

        if (gd.y > rainCanvas.height + 10) {
          gd.y = -10;
          gd.x = Math.random() * rainCanvas.width;
        }
      }

      requestAnimationFrame(animateRain);
    }
    animateRain();

    // DOM Ready: Attempt instant playback on entry
    window.addEventListener("DOMContentLoaded", () => {
      syncRadioToLive(true);
    });
  </script>
